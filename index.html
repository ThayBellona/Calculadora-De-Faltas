<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Falta 2026</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
</head>
<body>

    <h1>📝 Calculadora de Falta 2026</h1>

    <div class="header-controls">
        <div>
            <label style="font-weight: bold; margin-right: 5px;">Período:</label>
            <select id="selectPeriodo" onchange="trocarPeriodo()">
                <option value="1">1º Período</option>
                <option value="3">3º Período</option>
                <option value="5">5º Período</option>
            </select>
        </div>
        <button class="btn btn-outline" onclick="reiniciarDados()">🔄 Resetar Quadro</button>
    </div>

    <div class="board-container">
        <div class="table-responsive">
            <table id="tabela">
                <thead>
                    <tr>
                        <th>Matéria</th>
                        <th>Aulas</th>
                        <th>Faltas</th>
                        <th>Limite</th>
                        <th>Restam</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-outline" onclick="adicionarMateria()">+ Nova Matéria</button>
            <button class="btn btn-blue" onclick="calcular()">Calcular Faltas</button>
        </div>
    </div>

    <div id="avisos"></div>

    <div class="schedule-header">
        <h2>Horários da Semana</h2>
        <button id="editarCalendarioBtn" class="btn btn-outline" onclick="toggleEdicaoCalendario()">✏️ Editar Horários</button>
    </div>

    <div id="dias-container">
        </div>

    <script>
        const tabela = document.querySelector("#tabela tbody");
        const avisos = document.getElementById("avisos");
        const diasContainer = document.getElementById("dias-container");
        const selectPeriodo = document.getElementById("selectPeriodo");
        const diasSemana = ["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
        const paperColors = ["var(--paper-1)", "var(--paper-2)", "var(--paper-3)", "var(--paper-4)", "var(--paper-5)", "var(--paper-6)"];
        let calendarioEditavel = false;

     const dadosIniciais = {
            "1": {
                materias: [
                    { nome:"Algoritmos", total:72, faltas:0 },
                    { nome:"Arquitetura de Computadores", total:72, faltas:0 },
                    { nome:"Inglês Técnico", total:36, faltas:0 },
                    { nome:"IHC", total:54, faltas:0 },
                    { nome:"Português Instrumental", total:36, faltas:0 },
                    { nome:"Matemática Aplicada", total:72, faltas:0 }
                ],
                calendario: { "Segunda-feira": [{materia:"Algoritmos", faltasDia:3}, {materia:"IHC", faltasDia:2}], "Terça-feira": [{materia:"Arquitetura de Computadores", faltasDia:3}, {materia:"Matemática Aplicada", faltasDia:2}], "Quarta-feira": [{materia:"Algoritmos", faltasDia:3}, {materia:"Matemática Aplicada", faltasDia:2}], "Quinta-feira": [{materia:"Inglês Técnico", faltasDia:3}, {materia:"Arquitetura de Computadores", faltasDia:2}], "Sexta-feira": [{materia:"IHC", faltasDia:2}, {materia:"Português Instrumental", faltasDia:3}], "Sábado": [] }
            },
            "3": {
                materias: [
                    { nome:"Orientação a Objetos", total:72, faltas:0 },
                    { nome:"Engenharia de Software II", total:54, faltas:0 },
                    { nome:"Estatística", total:54, faltas:0 },
                    { nome:"Redes de Computadores I", total:72, faltas:0 },
                    { nome:"Banco de Dados II", total:72, faltas:0 },
                    { nome:"Construção de Página Web II", total:72, faltas:0 }
                ],
                calendario: { "Segunda-feira": [{materia:"Orientação a Objetos", faltasDia:3}, {materia:"Banco de Dados II", faltasDia:2}], "Terça-feira": [{materia:"Engenharia de Software II", faltasDia:2}, {materia:"Estatística", faltasDia:3}], "Quarta-feira": [{materia:"Orientação a Objetos", faltasDia:3}, {materia:"Banco de Dados II", faltasDia:2}], "Quinta-feira": [{materia:"Redes de Computadores I", faltasDia:3}, {materia:"Construção de Página Web II", faltasDia:2}], "Sexta-feira": [{materia:"Engenharia de Software II", faltasDia:2}, {materia:"Redes de Computadores I", faltasDia:1}, {materia:"Construção de Página Web II", faltasDia:2}], "Sábado": [] }
            },
            "5": {
                materias: [
                    { nome:"Desenv. p/ Dispositivos Móveis I", total:72, faltas:0 },
                    { nome:"Lab de Desenvolvimento I", total:108, faltas:0 },
                    { nome:"Legislação Aplicada", total:54, faltas:0 },
                    { nome:"Metodologia da Pesquisa", total:108, faltas:0 },
                    { nome:"Programação Web II", total:108, faltas:0 }
                ],
                calendario: { "Segunda-feira": [{materia:"Lab de Desenvolvimento I", faltasDia:3}, {materia:"Desenv. p/ Dispositivos Móveis I", faltasDia:2}], "Terça-feira": [{materia:"Metodologia da Pesquisa", faltasDia:4}, {materia:"Legislação Aplicada", faltasDia:1}], "Quarta-feira": [{materia:"Programação Web II", faltasDia:3}, {materia:"Metodologia da Pesquisa", faltasDia:2}], "Quinta-feira": [{materia:"Lab de Desenvolvimento I", faltasDia:3}, {materia:"Legislação Aplicada", faltasDia:2}], "Sexta-feira": [{materia:"Programação Web II", faltasDia:3}, {materia:"Desenv. p/ Dispositivos Móveis I", faltasDia:2}], "Sábado": [] }
            }
        };

        window.onload = () => {
            const p = localStorage.getItem("periodoSelecionado") || "1";
            selectPeriodo.value = p;
            const mats = JSON.parse(localStorage.getItem("materias")) || dadosIniciais[p].materias;
            const cal = JSON.parse(localStorage.getItem("calendario")) || dadosIniciais[p].calendario;
            mats.forEach(adicionarLinha);
            carregarCalendario(cal);
            calcular();
        };

        function trocarPeriodo() { 
            if(confirm("Mudar o período fará o quadro voltar ao padrão. Deseja continuar?")) reiniciarDados(); 
        }
        
        function reiniciarDados() {
            const p = selectPeriodo.value;
            localStorage.setItem("periodoSelecionado", p);
            localStorage.setItem("materias", JSON.stringify(dadosIniciais[p].materias));
            localStorage.setItem("calendario", JSON.stringify(dadosIniciais[p].calendario));
            location.reload();
        }

        function adicionarLinha(m) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td contenteditable="true" oninput="calcular()">${m.nome}</td>
                <td><input type="number" value="${m.total}" oninput="calcular()"></td>
                <td><input type="number" value="${m.faltas}" oninput="calcular()"></td>
                <td style="color:#64748b">—</td>
                <td style="font-weight:700">—</td>
                <td><button class="btn-remover" onclick="removerMateria(this)" title="Apagar Matéria">🗑️</button></td>
            `;
            tabela.appendChild(tr);
        }

        function adicionarMateria() { 
            adicionarLinha({nome:"Nova Matéria", total:0, faltas:0}); 
            salvarMaterias(); 
        }
        
        function removerMateria(b) { 
            b.closest("tr").remove(); 
            salvarMaterias(); 
            calcular(); 
        }

        function calcular() {
            const linhas = tabela.querySelectorAll("tr");
            const cal = JSON.parse(localStorage.getItem("calendario"));
            let msgs = [];
            linhas.forEach(l => {
                const n = l.children[0].textContent.trim();
                const t = parseFloat(l.children[1].children[0].value) || 0;
                const f = parseFloat(l.children[2].children[0].value) || 0;
                const max = Math.floor(t * 0.25);
                const rest = max - f;
                l.children[3].textContent = max;
                l.children[4].textContent = rest >= 0 ? rest : "REPROVADO";
                l.children[4].style.color = rest < 0 ? "var(--danger)" : "#059669";
                if(cal) {
                    for(const [dia, aulas] of Object.entries(cal)) {
                        aulas.forEach(a => {
                            if(a.materia.toLowerCase() === n.toLowerCase() && rest > 0 && rest <= a.faltasDia) {
                                msgs.push(`🚨 Cuidado: Se faltar na ${dia}, estoura o limite em ${n}!`);
                            }
                        });
                    }
                }
            });
            avisos.innerHTML = msgs.map(m => `<div>${m}</div>`).join("");
            avisos.style.display = msgs.length > 0 ? "block" : "none";
            salvarMaterias();
        }

        function salvarMaterias() {
            const mats = Array.from(tabela.querySelectorAll("tr")).map(l => ({
                nome: l.children[0].textContent,
                total: l.children[1].children[0].value,
                faltas: l.children[2].children[0].value
            }));
            localStorage.setItem("materias", JSON.stringify(mats));
        }

        function carregarCalendario(cal) {
            diasContainer.innerHTML = "";
            diasSemana.forEach((dia, index) => {
                const div = document.createElement("div");
                div.className = "paper-card";
                div.dataset.dia = dia;
                div.style.setProperty('--paper-bg', paperColors[index]);
                div.style.backgroundColor = 'var(--paper-bg)';

                const aulas = cal[dia] || [];
                // Lógica do sábado invisível
                if (dia === "Sábado" && aulas.length === 0 && !calendarioEditavel) div.classList.add("hidden");

                div.innerHTML = `<strong>${dia.split('-')[0]}</strong>`;
                
                aulas.forEach((a, i) => {
                    const aDiv = document.createElement("div");
                    aDiv.className = "class-item";
                    aDiv.innerHTML = `
                        <span class="m-nome">${a.materia}</span>
                        <span class="m-faltas">${a.faltasDia} aulas</span>
                        <button onclick="removerAula('${dia}',${i})" class="del-aula" style="display:none;" title="Remover">✕</button>
                    `;
                    div.appendChild(aDiv);
                });
                
                const b = document.createElement("button");
                b.className = "btn btn-add-aula";
                b.textContent = "+ Aula";
                b.style.display = "none";
                b.onclick = () => adicionarAula(dia);
                div.appendChild(b);
                
                diasContainer.appendChild(div);
            });
        }

        function toggleEdicaoCalendario() {
            calendarioEditavel = !calendarioEditavel;
            const b = document.getElementById("editarCalendarioBtn");
            b.textContent = calendarioEditavel ? "💾 Salvar Folhas" : "✏️ Editar Folhas";
            b.className = calendarioEditavel ? "btn btn-blue" : "btn btn-outline";
            
            const sabado = document.querySelector('[data-dia="Sábado"]');
            if (calendarioEditavel && sabado) sabado.classList.remove("hidden");
            
            document.querySelectorAll(".del-aula, .btn-add-aula").forEach(x => x.style.display = calendarioEditavel ? "block" : "none");
            document.querySelectorAll(".m-nome, .m-faltas").forEach(x => x.contentEditable = calendarioEditavel);
            
            if(!calendarioEditavel) { 
                salvarCalNoStorage(); 
                const cal = JSON.parse(localStorage.getItem("calendario"));
                carregarCalendario(cal); 
                calcular(); 
            }
        }

        function adicionarAula(dia) {
            const cal = JSON.parse(localStorage.getItem("calendario"));
            cal[dia].push({materia: "Nova Matéria", faltasDia: 1});
            localStorage.setItem("calendario", JSON.stringify(cal));
            carregarCalendario(cal);
            calendarioEditavel = false; toggleEdicaoCalendario();
        }

        function removerAula(dia, i) {
            const cal = JSON.parse(localStorage.getItem("calendario"));
            cal[dia].splice(i, 1);
            localStorage.setItem("calendario", JSON.stringify(cal));
            carregarCalendario(cal);
            calendarioEditavel = false; toggleEdicaoCalendario();
        }

        function salvarCalNoStorage() {
            const cal = {};
            document.querySelectorAll(".paper-card").forEach(d => {
                const dia = d.dataset.dia;
                cal[dia] = Array.from(d.querySelectorAll(".class-item")).map(a => ({
                    materia: a.querySelector(".m-nome").textContent.trim(),
                    faltasDia: parseInt(a.querySelector(".m-faltas").textContent.replace(/\D/g,'')) || 0
                }));
            });
            localStorage.setItem("calendario", JSON.stringify(cal));
        }
    </script>
</body>

</html>
