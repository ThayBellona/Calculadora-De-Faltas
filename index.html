<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Falta 2026</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    
    <link rel="stylesheet" href="css/estilo.css">
    
    <style>
        /* Estilos do Modo Simulação */
        .btn-simular {
            margin-top: auto;
            background: rgba(255,255,255,0.6);
            border: 1px dashed #94a3b8;
            font-size: 0.8rem;
            padding: 6px;
            width: 100%;
            justify-content: center;
            color: #475569;
        }
        .btn-simular:hover { background: #cbd5e1; color: #1e293b; }
        
        .postit.simulando {
            transform: scale(1.05) rotate(0deg);
            z-index: 20;
            box-shadow: 0 0 0 4px var(--primary), 5px 5px 20px rgba(0,0,0,0.2);
        }

        .falta-simulada {
            color: #d97706 !important;
            font-weight: bold;
            background-color: #fef3c7;
        }

        /* Barra de Controle da Simulação */
        #barra-simulacao {
            display: none;
            background: #fffbeb;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        #barra-simulacao p { margin: 0; font-weight: 600; color: #b45309; font-family: 'Kalam', cursive; font-size: 1.2rem;}
        .btn-cancelar-sim { background: white; border: 1px solid #d1d5db; color: #475569; }
        .btn-salvar-sim { background: #f59e0b; color: white; border: none; }
        .btn-salvar-sim:hover { background: #d97706; }
    </style>
</head>
<body>

    <h1>📝 Calculadora de Falta 2026</h1>

    <div class="header-controls">
        <div>
            <label style="font-weight: bold; margin-right: 5px;">Período:</label>
            <select id="selectPeriodo" onchange="trocarPeriodo()">
                <option value="">Carregando...</option>
            </select>
        </div>
        <button class="btn btn-outline" onclick="reiniciarDados()">🔄 Resetar Quadro</button>
    </div>

    <div class="board-container">
        
        <div id="barra-simulacao">
            <p id="texto-simulacao">Modo Simulação Ativo!</p>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-cancelar-sim" onclick="cancelarSimulacao()">Cancelar</button>
                <button class="btn btn-salvar-sim" onclick="salvarSimulacao()">Salvar Faltas</button>
            </div>
        </div>

        <div class="table-responsive">
            <table id="tabela">
                <thead>
                    <tr>
                        <th>Matéria</th>
                        <th>Aulas</th>
                        <th>Faltas</th>
                        <th>Limite</th>
                        <th>Restam</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn btn-outline" onclick="adicionarMateria()">+ Nova Matéria</button>
            <button class="btn btn-blue" onclick="calcular()">Calcular Faltas</button>
        </div>
    </div>

    <div id="avisos"></div>

    <div class="schedule-header">
        <h2>Horários da Semana</h2>
        <button id="editarCalendarioBtn" class="btn btn-outline" onclick="toggleEdicaoCalendario()">✏️ Editar Folhas</button>
    </div>

    <div id="dias-container">
        </div>

    <script>
        const tabela = document.querySelector("#tabela tbody");
        const avisos = document.getElementById("avisos");
        const diasContainer = document.getElementById("dias-container");
        const selectPeriodo = document.getElementById("selectPeriodo");
        const barraSimulacao = document.getElementById("barra-simulacao");
        const textoSimulacao = document.getElementById("texto-simulacao");
        
        const diasSemana = ["Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
        const paperColors = ["var(--paper-1)", "var(--paper-2)", "var(--paper-3)", "var(--paper-4)", "var(--paper-5)", "var(--paper-6)"];
        
        let calendarioEditavel = false;
        let modoSimulacaoAtivo = false;
        let estadoAntesSimulacao = [];

        // O SITE NASCE VAZIO E DEPENDE DA EXTENSÃO (ou do que já foi salvo na memória)
        let dadosIniciais = JSON.parse(localStorage.getItem("dadosHorariosBase"));

        window.onload = () => {
            // LÓGICA DE SINCRONIZAÇÃO DA EXTENSÃO
            const urlParams = new URLSearchParams(window.location.search);
            const syncData = urlParams.get('sincronizar');

            if (syncData) {
                try {
                    const pacote = JSON.parse(decodeURIComponent(syncData));
                    
                    // Salva a base de horários do IFAC na memória do navegador
                    dadosIniciais = pacote.horariosIFAC;
                    localStorage.setItem("dadosHorariosBase", JSON.stringify(dadosIniciais));
                    
                    // Cruza os horários do IFAC com as faltas reais do SUAP
                    let materiasAtualizadas = dadosIniciais[pacote.periodoSUAP].materias.map(mat => {
                        const matSuap = pacote.faltasSUAP.find(s => s.materia.toLowerCase().includes(mat.nome.toLowerCase()) || mat.nome.toLowerCase().includes(s.materia.toLowerCase()));
                        if(matSuap) mat.faltas = matSuap.faltas;
                        return mat;
                    });

                    // Define o que vai aparecer na tela agora
                    localStorage.setItem("periodoSelecionado", pacote.periodoSUAP);
                    localStorage.setItem("materias", JSON.stringify(materiasAtualizadas));
                    localStorage.setItem("calendario", JSON.stringify(dadosIniciais[pacote.periodoSUAP].calendario));

                    // Limpa a URL pra ficar limpa e sem código vazando
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch(e) {
                    console.error("Erro ao sincronizar dados", e);
                }
            }

            // LÓGICA DE MONTAGEM DA TELA
            selectPeriodo.innerHTML = ""; // Limpa os options

            if (dadosIniciais) {
                // Cria as opções do período baseado no que o site do IFAC informou
                Object.keys(dadosIniciais).forEach(per => {
                    const option = document.createElement("option");
                    option.value = per;
                    option.textContent = per + "º Período";
                    selectPeriodo.appendChild(option);
                });

                const p = localStorage.getItem("periodoSelecionado") || Object.keys(dadosIniciais)[0];
                selectPeriodo.value = p;

                const mats = JSON.parse(localStorage.getItem("materias")) || dadosIniciais[p].materias;
                const cal = JSON.parse(localStorage.getItem("calendario")) || dadosIniciais[p].calendario;
                
                mats.forEach(adicionarLinha);
                carregarCalendario(cal);
                calcular();
            } else {
                // Tela de boas vindas para quem não usou a extensão ainda
                selectPeriodo.innerHTML = "<option>Aguardando Sincronização...</option>";
                avisos.innerHTML = "<div>⚠️ Olá! Instale a nossa Extensão do Chrome e clique em 'Sincronizar Dados' enquanto estiver no seu Boletim do SUAP. Nós montaremos a sua grade automaticamente!</div>";
                avisos.style.display = "block";
            }
        };

        function trocarPeriodo() { 
            if(modoSimulacaoAtivo) { alert("Cancele ou Salve a simulação antes de trocar de período."); return; }
            if(!dadosIniciais) return;

            if(confirm("Mudar o período resetará o quadro para as configurações padrão daquele semestre. Deseja continuar?")) {
                reiniciarDados(true); // Chama a função passando 'true' para não pedir confirmação de novo
            } else {
                // Se cancelar, volta o select pro valor que estava salvo
                selectPeriodo.value = localStorage.getItem("periodoSelecionado");
            }
        }
        
        function reiniciarDados(veioDoTrocarPeriodo = false) {
            if(modoSimulacaoAtivo) { alert("Cancele ou Salve a simulação antes."); return; }
            if(!dadosIniciais) return;

            if(veioDoTrocarPeriodo || confirm("Voltar a grade ao estado padrão do IFAC (Isso removerá as faltas e edições manuais)?")) {
                const p = selectPeriodo.value;
                localStorage.setItem("periodoSelecionado", p);
                localStorage.setItem("materias", JSON.stringify(dadosIniciais[p].materias));
                localStorage.setItem("calendario", JSON.stringify(dadosIniciais[p].calendario));
                location.reload();
            }
        }

        function adicionarLinha(m) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td data-label="Matéria:" contenteditable="true" oninput="calcular()">${m.nome}</td>
                <td data-label="Aulas:"><input type="number" value="${m.total}" oninput="calcular()"></td>
                <td data-label="Faltas:"><input type="number" value="${m.faltas}" oninput="calcular()"></td>
                <td data-label="Limite:" style="color:#64748b">—</td>
                <td data-label="Restam:" style="font-weight:700">—</td>
                <td data-label="Ação:"><button class="btn-remover" onclick="if(!modoSimulacaoAtivo) removerMateria(this)" title="Apagar Matéria">🗑️</button></td>
            `;
            tabela.appendChild(tr);
        }

        function adicionarMateria() { 
            if(modoSimulacaoAtivo) return;
            adicionarLinha({nome:"Nova Matéria", total:0, faltas:0}); 
            salvarMaterias(); 
        }
        
        function removerMateria(b) { 
            b.closest("tr").remove(); 
            salvarMaterias(); 
            calcular(); 
        }

        function calcular() {
            const linhas = tabela.querySelectorAll("tr");
            const cal = JSON.parse(localStorage.getItem("calendario"));
            let msgs = [];
            
            linhas.forEach(l => {
                const n = l.children[0].textContent.trim();
                const t = parseFloat(l.children[1].children[0].value) || 0;
                const f = parseFloat(l.children[2].children[0].value) || 0;
                const max = Math.floor(t * 0.25);
                const rest = max - f;
                
                l.children[3].textContent = max;
                l.children[4].textContent = rest >= 0 ? rest : "REPROVADO";
                l.children[4].style.color = rest < 0 ? "var(--danger)" : "#059669";
                
                if(cal && !modoSimulacaoAtivo) {
                    for(const [dia, aulas] of Object.entries(cal)) {
                        aulas.forEach(a => {
                            if(a.materia.toLowerCase() === n.toLowerCase() && rest > 0 && rest <= a.faltasDia) {
                                msgs.push(`🚨 Cuidado: Se faltar na ${dia}, estoura o limite em ${n}!`);
                            }
                        });
                    }
                }
            });
            
            if(!modoSimulacaoAtivo && dadosIniciais) {
                avisos.innerHTML = msgs.map(m => `<div>${m}</div>`).join("");
                avisos.style.display = msgs.length > 0 ? "block" : "none";
                salvarMaterias();
            }
        }

        function salvarMaterias() {
            if(modoSimulacaoAtivo || !dadosIniciais) return; 
            const mats = Array.from(tabela.querySelectorAll("tr")).map(l => ({
                nome: l.children[0].textContent,
                total: l.children[1].children[0].value,
                faltas: l.children[2].children[0].value
            }));
            localStorage.setItem("materias", JSON.stringify(mats));
        }

        function carregarCalendario(cal) {
            diasContainer.innerHTML = "";
            diasSemana.forEach((dia, index) => {
                const div = document.createElement("div");
                div.className = "paper-card";
                div.dataset.dia = dia;
                div.style.setProperty('--paper-bg', paperColors[index]);
                div.style.backgroundColor = 'var(--paper-bg)';

                const aulas = cal[dia] || [];
                if (dia === "Sábado" && aulas.length === 0 && !calendarioEditavel) div.classList.add("hidden");

                div.innerHTML = `<strong>${dia.split('-')[0]}</strong>`;
                
                aulas.forEach((a, i) => {
                    const aDiv = document.createElement("div");
                    aDiv.className = "class-item";
                    aDiv.innerHTML = `
                        <span class="m-nome">${a.materia}</span>
                        <span class="m-faltas">${a.faltasDia} aulas</span>
                        <button onclick="if(!modoSimulacaoAtivo) removerAula('${dia}',${i})" class="del-aula" style="display:none;" title="Remover">✕</button>
                    `;
                    div.appendChild(aDiv);
                });
                
                const bAdd = document.createElement("button");
                bAdd.className = "btn btn-add-aula";
                bAdd.textContent = "+ Aula";
                bAdd.style.display = "none";
                bAdd.onclick = () => { if(!modoSimulacaoAtivo) adicionarAula(dia) };
                
                const bSimular = document.createElement("button");
                bSimular.className = "btn btn-simular";
                bSimular.textContent = "📅 Faltar Hoje";
                bSimular.onclick = () => iniciarSimulacao(dia, div);
                if (aulas.length === 0) bSimular.style.display = "none";

                div.appendChild(bAdd);
                div.appendChild(bSimular);
                
                diasContainer.appendChild(div);
            });
        }

        // --- SISTEMA DE SIMULAÇÃO ---

        function iniciarSimulacao(dia, cardPostit) {
            if(calendarioEditavel) return;
            if(modoSimulacaoAtivo) {
                alert("Você já está simulando um dia. Cancele ou salve antes de tentar outro.");
                return;
            }

            const cal = JSON.parse(localStorage.getItem("calendario"));
            const aulasDoDia = cal[dia] || [];
            if (aulasDoDia.length === 0) return;

            modoSimulacaoAtivo = true;
            estadoAntesSimulacao = [];

            avisos.style.display = "none";
            cardPostit.classList.add("simulando");

            textoSimulacao.textContent = `👀 Simulando: O que acontece se eu faltar na ${dia.split('-')[0]}?`;
            barraSimulacao.style.display = "flex";

            const linhas = tabela.querySelectorAll("tr");
            linhas.forEach(linha => {
                const nomeMateria = linha.children[0].textContent.trim();
                const inputFalta = linha.children[2].querySelector("input");
                const faltasOriginais = parseFloat(inputFalta.value) || 0;
                
                estadoAntesSimulacao.push({ linha: linha, valorOriginal: faltasOriginais });

                aulasDoDia.forEach(aulaDia => {
                    if (nomeMateria.toLowerCase() === aulaDia.materia.toLowerCase()) {
                        inputFalta.value = faltasOriginais + aulaDia.faltasDia;
                        inputFalta.classList.add("falta-simulada"); 
                    }
                });
            });

            calcular();
        }

        function cancelarSimulacao() {
            estadoAntesSimulacao.forEach(item => {
                const inputFalta = item.linha.children[2].querySelector("input");
                inputFalta.value = item.valorOriginal;
                inputFalta.classList.remove("falta-simulada");
            });
            encerrarModoSimulacao();
        }

        function salvarSimulacao() {
            const linhas = tabela.querySelectorAll("tr");
            linhas.forEach(linha => {
                const inputFalta = linha.children[2].querySelector("input");
                inputFalta.classList.remove("falta-simulada");
            });
            encerrarModoSimulacao();
            salvarMaterias(); 
            calcular(); 
        }

        function encerrarModoSimulacao() {
            modoSimulacaoAtivo = false;
            estadoAntesSimulacao = [];
            barraSimulacao.style.display = "none";
            
            const postitDestacado = document.querySelector(".postit.simulando, .paper-card.simulando");
            if(postitDestacado) postitDestacado.classList.remove("simulando");
            
            calcular(); 
        }

        // --- MODO EDIÇÃO DO CALENDÁRIO ---

        function toggleEdicaoCalendario() {
            if(modoSimulacaoAtivo) { alert("Cancele a simulação antes de editar as folhas."); return; }
            if(!dadosIniciais) { alert("Você precisa sincronizar os dados primeiro!"); return; }
            
            calendarioEditavel = !calendarioEditavel;
            const b = document.getElementById("editarCalendarioBtn");
            b.textContent = calendarioEditavel ? "💾 Salvar Folhas" : "✏️ Editar Folhas";
            b.className = calendarioEditavel ? "btn btn-blue" : "btn btn-outline";
            
            const sabado = document.querySelector('[data-dia="Sábado"]');
            if (calendarioEditavel && sabado) sabado.classList.remove("hidden");
            
            document.querySelectorAll(".del-aula, .btn-add-aula").forEach(x => x.style.display = calendarioEditavel ? "block" : "none");
            document.querySelectorAll(".btn-simular").forEach(x => x.style.display = calendarioEditavel ? "none" : "flex");
            document.querySelectorAll(".m-nome").forEach(x => x.contentEditable = calendarioEditavel);
            
            if(!calendarioEditavel) { 
                salvarCalNoStorage(); 
                const cal = JSON.parse(localStorage.getItem("calendario"));
                carregarCalendario(cal); 
                calcular(); 
            }
        }

        function adicionarAula(dia) {
            const cal = JSON.parse(localStorage.getItem("calendario"));
            cal[dia].push({materia: "Nova Matéria", faltasDia: 1});
            localStorage.setItem("calendario", JSON.stringify(cal));
            carregarCalendario(cal);
            calendarioEditavel = false; toggleEdicaoCalendario();
        }

        function removerAula(dia, i) {
            const cal = JSON.parse(localStorage.getItem("calendario"));
            cal[dia].splice(i, 1);
            localStorage.setItem("calendario", JSON.stringify(cal));
            carregarCalendario(cal);
            calendarioEditavel = false; toggleEdicaoCalendario();
        }

        function salvarCalNoStorage() {
            const cal = {};
            document.querySelectorAll(".paper-card").forEach(d => {
                const dia = d.dataset.dia;
                cal[dia] = Array.from(d.querySelectorAll(".class-item")).map(a => {
                    const spanNome = a.querySelector('.m-nome').innerText;
                    const spanFaltas = a.querySelector('.m-faltas').innerText;
                    return {
                        materia: spanNome.trim(),
                        faltasDia: parseInt(spanFaltas.replace(/\D/g,'')) || 0
                    }
                });
            });
            localStorage.setItem("calendario", JSON.stringify(cal));
        }
    </script>
</body>
</html>
